<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Athena Chat</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/chat.css" />
  </head>
  <body class="chat-page">
    <aside id="sidebar" class="chat-sidebar">
      <div class="sidebar-head">
        <div class="chat-title"><img class="brand-mark" src="logo.svg" alt="" width="20" height="20" /> Athena</div>
        <button id="sb-new" class="btn primary sb-new" type="button">+ New chat</button>
      </div>
      <div id="conv-list" class="conv-list"></div>
    </aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <div class="chat-main">
      <header class="chat-header">
        <div class="chat-header-inner">
          <div class="header-side header-left">
            <button id="sb-toggle" class="icon-btn" type="button" title="Toggle history" aria-label="Toggle history">
              ☰
            </button>
            <img class="brand-mark header-logo" src="logo.svg" alt="Athena" width="20" height="20" />
            <div id="header-title" class="header-title">New chat</div>
          </div>
          <div class="header-side header-right">
            <button id="export-btn" class="icon-btn" type="button" title="Download as Markdown" aria-label="Download as Markdown">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <div class="mode-toggle" id="mode-toggle" title="How answers are explained">
              <button class="mode-btn active" data-mode="business" type="button">Business</button>
              <button class="mode-btn" data-mode="technical" type="button">Technical</button>
            </div>
            <select id="lang-select" class="lang-select" title="Response language">
              <option value="en">English</option>
              <option value="vi">Tiếng Việt</option>
            </select>
          </div>
        </div>
      </header>

      <div id="banner" class="chat-banner" hidden></div>

      <main id="messages" class="messages">
        <div id="empty" class="chat-empty">
          <h2>Understand how the product works</h2>
          <p>
            Ask in plain language — it reads the real code and explains the business flow, step by step. No technical
            background needed.
          </p>
          <p class="chat-empty-tip">
            Tip: type <b>@</b> to focus on one app, <b>#</b> to focus on a specific feature/screen.
          </p>
          <div id="suggestions" class="suggestions"></div>
        </div>
      </main>

      <button id="scroll-bottom" class="scroll-bottom" type="button" title="Jump to latest" aria-label="Jump to latest">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
      </button>

      <form id="composer" class="composer">
        <div class="composer-main">
          <div id="scope-bar" class="scope-bar"></div>
          <textarea
            id="input"
            rows="1"
            placeholder="Ask anything…  /repo or /doc, @tool, #symbol to narrow scope · Enter to send"
          ></textarea>
          <div id="mention-list" class="mention-list" hidden></div>
        </div>
        <button id="send" class="btn primary" type="submit">Send</button>
      </form>
    </div>

    <!-- Slide-over panel that shows a cited document passage in full -->
    <div id="source-panel" class="source-panel" hidden>
      <div id="source-backdrop" class="source-backdrop"></div>
      <aside class="source-sheet" role="dialog" aria-modal="true" aria-label="Document passage">
        <header class="source-sheet-head">
          <div id="source-heading" class="source-heading"></div>
          <button id="source-close" class="icon-btn" type="button" title="Close" aria-label="Close">✕</button>
        </header>
        <div id="source-body" class="source-body"></div>
      </aside>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
